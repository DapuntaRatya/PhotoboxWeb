# Replace VPS_PUBLIC_IP and install as /etc/nginx/conf.d/projects-ip.conf.
# Project files are included inside the server blocks.
server {
    listen 80 default_server;
    server_name VPS_PUBLIC_IP;

    if ($host != $server_name) { return 404; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    include /etc/nginx/project-redirects/*.conf;
    location / { return 404; }
}

server {
    listen 443 ssl default_server;
    server_name VPS_PUBLIC_IP;
    ssl_certificate /etc/letsencrypt/live/VPS_PUBLIC_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/VPS_PUBLIC_IP/privkey.pem;

    if ($host != $server_name) { return 404; }
    include /etc/nginx/project-routes/*.conf;
    location / { return 404; }
}
