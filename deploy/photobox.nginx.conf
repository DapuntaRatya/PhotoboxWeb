# Install as /etc/nginx/project-routes/photobox.conf.
location = /photobox {
    access_log off;
    return 308 /photobox/$is_args$args;
}

location /photobox/ {
    include /etc/nginx/snippets/photobox-headers.conf;
    alias /opt/photoboxweb/dist/;
}

location ~ "^/photobox/(?:room|album)/[a-f0-9]{32}/?$" {
    include /etc/nginx/snippets/photobox-headers.conf;
    alias /opt/photoboxweb/dist/index.html;
}

location ^~ /photobox/api/ {
    include /etc/nginx/snippets/photobox-headers.conf;
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:8787/api/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /photobox/ws {
    include /etc/nginx/snippets/photobox-headers.conf;
    proxy_pass http://127.0.0.1:8787/ws;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
}
